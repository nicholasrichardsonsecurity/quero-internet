name: quero-internet-homolog

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${HOMOLOG_POSTGRES_DB}
      POSTGRES_USER: ${HOMOLOG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${HOMOLOG_POSTGRES_PASSWORD}
    volumes:
      - homolog_postgres_data:/var/lib/postgresql/data
    networks:
      - homolog_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOMOLOG_POSTGRES_USER} -d ${HOMOLOG_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${HOMOLOG_REDIS_PASSWORD}"]
    volumes:
      - homolog_redis_data:/data
    networks:
      - homolog_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${HOMOLOG_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${HOMOLOG_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${HOMOLOG_MINIO_ROOT_PASSWORD}
    volumes:
      - homolog_minio_data:/data
    networks:
      - homolog_internal

networks:
  homolog_internal:
    internal: true

volumes:
  homolog_postgres_data:
  homolog_redis_data:
  homolog_minio_data:
