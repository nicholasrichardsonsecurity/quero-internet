name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'mission/**'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - name: Audit production high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=high

  sast:
    name: SAST and secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan OWASP and secrets
        run: semgrep scan --config=p/owasp-top-ten --config=p/secrets --error --exclude=node_modules --exclude=.next apps packages
