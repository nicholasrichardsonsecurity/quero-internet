name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile=false
      - name: Audit production high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=high

  sast:
    name: SAST and secret patterns
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Python tooling
        run: |
          python3 --version
          python3 -m pip --version || (apt-get update && apt-get install -y python3-pip)
      - name: Install Semgrep
        run: python3 -m pip install --break-system-packages --disable-pip-version-check semgrep
      - name: Scan OWASP and secrets
        run: semgrep scan --config=p/owasp-top-ten --config=p/secrets --error --exclude=node_modules --exclude=.next apps packages
