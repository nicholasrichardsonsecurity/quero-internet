name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quero_internet
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: quero_internet
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quero_internet -d quero_internet"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://quero_internet:change_me@localhost:5432/quero_internet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
